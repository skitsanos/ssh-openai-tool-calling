version: "3"

dotenv:
  - .env

vars:
  BASH: bash

tasks:
  default:
    desc: List available demo tasks
    cmds:
      - task --list

  setup:
    desc: Verify local shell dependencies
    cmds:
      - "{{.BASH}} scripts/check_dependencies.sh"

  plain:
    desc: Chat Completions plain text response demo
    deps: [setup]
    cmds:
      - "{{.BASH}} scripts/chat_plain.sh"

  json:
    desc: Chat Completions JSON Schema response_format demo
    deps: [setup]
    cmds:
      - "{{.BASH}} scripts/chat_json_schema.sh"

  tools:
    desc: Chat Completions tool calling demo backed by shell scripts
    deps: [setup]
    cmds:
      - "{{.BASH}} scripts/chat_tool_calling.sh"

  chat:
    desc: Interactive Chat Completions CLI
    deps: [setup]
    interactive: true
    cmds:
      - "{{.BASH}} scripts/chat_cli.sh"

  responses:plain:
    desc: Responses API plain text demo
    deps: [setup]
    cmds:
      - "{{.BASH}} scripts/responses_plain.sh"

  responses:json:
    desc: Responses API JSON Schema text.format demo
    deps: [setup]
    cmds:
      - "{{.BASH}} scripts/responses_json_schema.sh"

  responses:tools:
    desc: Responses API tool calling demo backed by shell scripts
    deps: [setup]
    cmds:
      - "{{.BASH}} scripts/responses_tool_calling.sh"

  responses:all:
    desc: Run all non-interactive Responses API demos
    cmds:
      - task responses:plain
      - task responses:json
      - task responses:tools

  all:
    desc: Run all non-interactive OpenAI API demos
    cmds:
      - task plain
      - task json
      - task tools
      - task responses:all

  check:
    desc: Run local static checks for shell and JSON files
    cmds:
      - "{{.BASH}} -n scripts/*.sh scripts/lib/*.sh tools/*.sh"
      - jq empty tools/tools.json
